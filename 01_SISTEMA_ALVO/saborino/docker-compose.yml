name: sistema-saborino

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env

  api:
    build: ./backend
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  celery:
    build: ./backend
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  dashboard:
    build: ./backend

    command: celery -A core flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - celery
  frontend:
    build: ./ui
    volumes:
      - ./ui:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - api
volumes:
  postgres_data:
  redis_data:
